<?xml version="1.0" encoding="utf-8"?>
<!-- Spectra editor icon. Swap this file to change the glyph; the build
     turns every .svg in this folder into the resource the shell binds.
     The path data is copied VERBATIM and the width/height against the
     viewBox becomes a transform, so nothing here is ever rewritten. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
     fill="none" stroke="currentColor">
  <!-- Converting between block and part is its OWN verb and gets its own
       glyph: two kinds, swapping. It used to borrow the part cube, so one
       drawing meant both "insert a part" and "convert to part" in one row. -->
  <path d="M2.5,2.5 L7,2.5 L7,7 L2.5,7 Z M9,9 L13.5,9 L13.5,13.5 L9,13.5 Z M8.4,4.75 L12.6,4.75 M12.6,4.75 L10.9,3.1 M7.6,11.25 L3.4,11.25 M3.4,11.25 L5.1,12.9" />
</svg>
