     fill="none" stroke="currentColor">
  <path d="M2.5,4.5 L13.5,4.5 M6.5,4.5 L6.5,2.5 L9.5,2.5 L9.5,4.5 M4.5,4.5 L5.2,13.5 L10.8,13.5 L11.5,4.5" />
</svg>
