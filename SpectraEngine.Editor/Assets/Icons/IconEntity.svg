<?xml version="1.0" encoding="utf-8"?>
<!-- Spectra editor icon. Swap this file to change the glyph; the build
     turns every .svg in this folder into the resource the shell binds.
     The path data is copied VERBATIM and the width/height against the
     viewBox becomes a transform, so nothing here is ever rewritten. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
     fill="none" stroke="currentColor">
  <!-- An entity: a diamond. Deliberately the only glyph in the set that is not
       a cube, a sphere, a folder, a bulb or a cross - an entity has no shape of
       its own to draw, so the mark has to be an abstract one, and a diamond is
       what every level editor since Quake has used for a point entity. It is
       told apart by silhouette alone, which is the rule: no dot, no wire stub,
       nothing inside it. -->
  <path d="M8,2.5 L13.5,8 L8,13.5 L2.5,8 Z" />
</svg>
